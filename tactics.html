<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VolleyPlan 🏐 自由拖曳戰術板與戰術庫</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#FDFBF7',
            ink: '#1E293B',
            vGreen: '#4ADE80',
            vYellow: '#FACC15',
            vOrange: '#FB923C',
            vBlue: '#38BDF8',
            vPurple: '#C084FC',
          },
          boxShadow: {
            'pop': '3px 3px 0px #1E293B',
            'pop-sm': '2px 2px 0px #1E293B',
            'pop-lg': '4px 4px 0px #1E293B',
          }
        }
      }
    }
  </script>
  <style>
    .btn-pop:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #1E293B;
    }
    .draggable-piece {
      touch-action: none;
      cursor: grab;
      user-select: none;
    }
    .draggable-piece:active {
      cursor: grabbing;
      transform: translate(-50%, -50%) scale(1.12);
      z-index: 30;
    }
  </style>
</head>
<body class="bg-cream text-ink font-sans min-h-screen pb-20 select-none">

  <!-- 頂部導覽列 -->
  <header class="max-w-md mx-auto pt-6 px-4">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-3xl">🏐</span>
        <h1 class="text-2xl font-black tracking-tight">VolleyPlan</h1>
      </div>
      <div class="flex gap-2">
        <a href="index.html" class="bg-vYellow border-2 border-ink px-3 py-1.5 rounded-xl text-xs font-black shadow-pop-sm btn-pop flex items-center gap-1">
          <span>← 返回排程器</span>
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 mt-4 space-y-4">

    <!-- 1. 自由拖曳排球戰術板 -->
    <section class="bg-white border-2 border-ink rounded-2xl p-4 shadow-pop">
      <div class="flex items-center justify-between mb-2">
        <div>
          <span class="text-[10px] font-black px-2 py-0.5 rounded-full border border-ink bg-vBlue">自由拖曳戰術板</span>
          <h2 class="text-base font-black mt-1">📋 拖曳球員與排球模擬跑位</h2>
        </div>
        <button onclick="exportBoardImage()" class="bg-vGreen border-2 border-ink px-2.5 py-1.5 rounded-xl text-xs font-black shadow-pop-sm btn-pop">
          🖼️ 存成圖卡
        </button>
      </div>

      <p class="text-[11px] font-bold text-slate-500 mb-2.5">💡 直接按住球場上的球員徽章或 🏐 即可自由拖曳擺位！</p>

      <!-- 快速預設底稿按鈕 -->
      <div class="grid grid-cols-3 gap-1.5 mb-3">
        <button onclick="applyPreset('base')" class="py-1.5 px-2 rounded-xl border-2 border-ink text-[11px] font-black bg-slate-100 hover:bg-vYellow shadow-pop-sm btn-pop">
          🔄 基本輪轉位
        </button>
        <button onclick="applyPreset('receive')" class="py-1.5 px-2 rounded-xl border-2 border-ink text-[11px] font-black bg-slate-100 hover:bg-vGreen shadow-pop-sm btn-pop">
          📥 W型接發球
        </button>
        <button onclick="applyPreset('block')" class="py-1.5 px-2 rounded-xl border-2 border-ink text-[11px] font-black bg-slate-100 hover:bg-vOrange shadow-pop-sm btn-pop">
          🛡️ 雙人攔網聯防
        </button>
      </div>

      <!-- 排球場視覺化畫布（截圖範圍） -->
      <div id="tacticBoardCapture" class="bg-cream p-2 rounded-2xl border-2 border-ink">
        <div class="flex justify-between items-center px-1 mb-1.5">
          <span id="boardTitleDisplay" class="text-xs font-black text-ink">目前戰術：基本輪轉站位</span>
          <span class="text-[10px] font-black text-slate-400">VolleyPlan 戰術板</span>
        </div>

        <div id="courtCanvas" class="relative w-full aspect-[4/3] bg-orange-100 border-4 border-ink rounded-xl overflow-hidden">
          <!-- 球網 -->
          <div class="w-full h-3.5 bg-ink flex items-center justify-center">
            <span class="text-[9px] font-black text-vYellow tracking-widest">━━━ 球網 NET ━━━</span>
          </div>

          <!-- 三米攻擊線 -->
          <div class="absolute top-[36%] left-0 right-0 border-b-2 border-dashed border-ink/50 flex justify-between px-2 pointer-events-none">
            <span class="text-[9px] font-black text-ink/50">前排攻擊區</span>
            <span class="text-[9px] font-black text-ink/50">3M 線</span>
          </div>

          <!-- 球場位置浮水印 -->
          <div class="absolute top-[20%] left-[18%] -translate-x-1/2 -translate-y-1/2 text-lg font-black text-ink/10 pointer-events-none">4</div>
          <div class="absolute top-[20%] left-[50%] -translate-x-1/2 -translate-y-1/2 text-lg font-black text-ink/10 pointer-events-none">3</div>
          <div class="absolute top-[20%] left-[82%] -translate-x-1/2 -translate-y-1/2 text-lg font-black text-ink/10 pointer-events-none">2</div>
          <div class="absolute top-[72%] left-[18%] -translate-x-1/2 -translate-y-1/2 text-lg font-black text-ink/10 pointer-events-none">5</div>
          <div class="absolute top-[72%] left-[50%] -translate-x-1/2 -translate-y-1/2 text-lg font-black text-ink/10 pointer-events-none">6</div>
          <div class="absolute top-[72%] left-[82%] -translate-x-1/2 -translate-y-1/2 text-lg font-black text-ink/10 pointer-events-none">1</div>

          <!-- 可自由拖曳的球員與排球容器 -->
          <div id="piecesLayer" class="relative w-full h-[calc(100%-14px)]"></div>
        </div>

        <!-- 戰術備註顯示區 -->
        <div id="boardNoteDisplay" class="mt-2 bg-white border-2 border-ink rounded-xl p-2 text-xs font-bold text-slate-700">
          備註：拖曳上方球員到指定落點，並在下方輸入跑位說明即可儲存成專屬戰術！
        </div>
      </div>
    </section>

    <!-- 2. 新增 / 儲存自訂戰術表單 -->
    <section class="bg-white border-2 border-ink rounded-2xl p-4 shadow-pop space-y-3">
      <h3 class="text-sm font-black flex items-center gap-1.5"><span>✏️</span> 儲存目前擺位為新戰術</h3>
      <div>
        <label class="block text-xs font-black text-slate-500 mb-1">戰術名稱</label>
        <input type="text" id="tacticNameInput" placeholder="例如：第二輪前排快攻掩護、防守反擊站位" class="w-full bg-slate-50 border-2 border-ink rounded-xl px-3 py-1.5 text-xs font-bold focus:outline-none">
      </div>
      <div>
        <label class="block text-xs font-black text-slate-500 mb-1">跑位口訣 / 細節說明</label>
        <textarea id="tacticNoteInput" rows="2" placeholder="寫下舉球插上路線、攔網併步或後排補位重點..." class="w-full bg-slate-50 border-2 border-ink rounded-xl p-2.5 text-xs font-medium focus:outline-none"></textarea>
      </div>
      <button onclick="saveCustomTactic()" class="w-full bg-vYellow border-2 border-ink py-2.5 rounded-xl font-black text-xs shadow-pop btn-pop">
        💾 儲存此戰術到下方戰術庫
      </button>
    </section>

    <!-- 3. 我的系隊戰術庫清單 -->
    <section class="space-y-2.5">
      <div class="flex justify-between items-center px-1">
        <span class="text-xs font-black text-slate-500">📚 已儲存的系隊戰術庫（點擊載入戰術板）</span>
      </div>
      <div id="savedTacticsList" class="space-y-2"></div>
    </section>

  </main>

  <!-- Toast 提示 -->
  <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-ink text-white text-xs font-bold px-4 py-2 rounded-full border-2 border-vYellow shadow-pop-lg transition-all duration-300 opacity-0 pointer-events-none z-50">
    提示訊息
  </div>

  <script>
    // 預設棋子狀態
    const PRESETS = {
      base: {
        title: '基本輪轉站位（R1 雙舉）',
        note: '前排 OH1(4) - MB1(3) - S2(2) 已在進攻位置，發球過網後無需大幅換位。',
        pieces: [
          { id: 'p_oh1', label: 'OH1', color: 'bg-vOrange', x: 18, y: 20 },
          { id: 'p_mb1', label: 'MB1', color: 'bg-vBlue',   x: 50, y: 20 },
          { id: 'p_s2',  label: 'S2',  color: 'bg-vYellow', x: 82, y: 20 },
          { id: 'p_mb2', label: 'MB2', color: 'bg-vBlue',   x: 18, y: 72 },
          { id: 'p_oh2', label: 'OH2', color: 'bg-vOrange', x: 50, y: 74 },
          { id: 'p_s1',  label: 'S1',  color: 'bg-vYellow', x: 82, y: 72 },
          { id: 'ball',  label: '🏐',  color: 'bg-white',   x: 50, y: 46 }
        ]
      },
      receive: {
        title: 'W型五人接發球陣型',
        note: '前排舉球 S2 貼網不接一傳，其餘五人組成 W 型防線，接發後 S2 迅速插上二號位舉球。',
        pieces: [
          { id: 'p_oh1', label: 'OH1', color: 'bg-vOrange', x: 20, y: 45 },
          { id: 'p_mb1', label: 'MB1', color: 'bg-vBlue',   x: 50, y: 55 },
          { id: 'p_s2',  label: 'S2',  color: 'bg-vYellow', x: 75, y: 14 },
          { id: 'p_mb2', label: 'MB2', color: 'bg-vBlue',   x: 22, y: 80 },
          { id: 'p_oh2', label: 'OH2', color: 'bg-vOrange', x: 78, y: 80 },
          { id: 'p_s1',  label: 'S1',  color: 'bg-vYellow', x: 80, y: 45 },
          { id: 'ball',  label: '🏐',  color: 'bg-white',   x: 50, y: 12 }
        ]
      },
      block: {
        title: '四號位雙人攔網＋後排聯防',
        note: 'MB1 併步靠攏 S2 形成雙人攔網封鎖對手主攻，OH1 退至三米線保護吊球，後排三人守重扣。',
        pieces: [
          { id: 'p_oh1', label: 'OH1', color: 'bg-vOrange', x: 25, y: 42 },
          { id: 'p_mb1', label: 'MB1', color: 'bg-vBlue',   x: 72, y: 13 },
          { id: 'p_s2',  label: 'S2',  color: 'bg-vYellow', x: 84, y: 13 },
          { id: 'p_mb2', label: 'MB2', color: 'bg-vBlue',   x: 20, y: 76 },
          { id: 'p_oh2', label: 'OH2', color: 'bg-vOrange', x: 52, y: 82 },
          { id: 'p_s1',  label: 'S1',  color: 'bg-vYellow', x: 82, y: 68 },
          { id: 'ball',  label: '🏐',  color: 'bg-white',   x: 80, y: 5 }
        ]
      }
    };

    let currentPieces = JSON.parse(JSON.stringify(PRESETS.base.pieces));
    let savedTactics = [];

    function loadTactics() {
      try {
        const raw = localStorage.getItem('volleyplan_tactics_v1');
        if (raw) {
          savedTactics = JSON.parse(raw);
        } else {
          savedTactics = [
            { id: 't_default_1', ...PRESETS.receive },
            { id: 't_default_2', ...PRESETS.block }
          ];
          saveTacticsToStorage();
        }
      } catch (e) {
        savedTactics = [];
      }
    }

    function saveTacticsToStorage() {
      try {
        localStorage.setItem('volleyplan_tactics_v1', JSON.stringify(savedTactics));
      } catch (e) {}
    }

    function applyPreset(key) {
      const p = PRESETS[key];
      if (!p) return;
      currentPieces = JSON.parse(JSON.stringify(p.pieces));
      document.getElementById('boardTitleDisplay').innerText = `目前戰術：${p.title}`;
      document.getElementById('boardNoteDisplay').innerText = `備註：${p.note}`;
      document.getElementById('tacticNameInput').value = p.title;
      document.getElementById('tacticNoteInput').value = p.note;
      renderPieces();
      showToast(`已載入「${p.title}」🏐`);
    }

    function renderPieces() {
      const layer = document.getElementById('piecesLayer');
      layer.innerHTML = '';

      currentPieces.forEach((piece, idx) => {
        const el = document.createElement('div');
        const isBall = piece.id === 'ball';
        el.className = `draggable-piece absolute -translate-x-1/2 -translate-y-1/2 ${isBall ? 'w-8 h-8 rounded-full flex items-center justify-center text-base' : 'px-2.5 py-1 rounded-xl text-xs font-black'} border-2 border-ink shadow-pop-sm ${piece.color}`;
        el.style.left = `${piece.x}%`;
        el.style.top = `${piece.y}%`;
        el.innerText = piece.label;

        // 支援滑鼠與觸控自由拖曳 (Pointer Events)
        el.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          el.setPointerCapture(e.pointerId);
          const rect = layer.getBoundingClientRect();

          const onMove = (moveEvt) => {
            let nx = ((moveEvt.clientX - rect.left) / rect.width) * 100;
            let ny = ((moveEvt.clientY - rect.top) / rect.height) * 100;
            nx = Math.max(6, Math.min(94, nx));
            ny = Math.max(6, Math.min(94, ny));
            piece.x = Math.round(nx);
            piece.y = Math.round(ny);
            el.style.left = `${piece.x}%`;
            el.style.top = `${piece.y}%`;
          };

          const onUp = (upEvt) => {
            el.releasePointerCapture(upEvt.pointerId);
            el.removeEventListener('pointermove', onMove);
            el.removeEventListener('pointerup', onUp);
          };

          el.addEventListener('pointermove', onMove);
          el.addEventListener('pointerup', onUp);
        });

        layer.appendChild(el);
      });
    }

    function saveCustomTactic() {
      const title = document.getElementById('tacticNameInput').value.trim();
      const note = document.getElementById('tacticNoteInput').value.trim();
      if (!title) {
        alert('請先輸入戰術名稱！');
        return;
      }

      const newTactic = {
        id: 't_' + Date.now(),
        title,
        note: note || '無額外文字備註',
        pieces: JSON.parse(JSON.stringify(currentPieces))
      };

      savedTactics.unshift(newTactic);
      saveTacticsToStorage();
      document.getElementById('boardTitleDisplay').innerText = `目前戰術：${title}`;
      document.getElementById('boardNoteDisplay').innerText = `備註：${newTactic.note}`;
      renderSavedTactics();
      showToast('已儲存到你的戰術庫！💾');
    }

    function loadSavedTactic(id) {
      const target = savedTactics.find(t => t.id === id);
      if (!target) return;
      currentPieces = JSON.parse(JSON.stringify(target.pieces));
      document.getElementById('boardTitleDisplay').innerText = `目前戰術：${target.title}`;
      document.getElementById('boardNoteDisplay').innerText = `備註：${target.note}`;
      document.getElementById('tacticNameInput').value = target.title;
      document.getElementById('tacticNoteInput').value = target.note;
      renderPieces();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      showToast(`已載入戰術「${target.title}」📋`);
    }

    function deleteSavedTactic(id, e) {
      e.stopPropagation();
      savedTactics = savedTactics.filter(t => t.id !== id);
      saveTacticsToStorage();
      renderSavedTactics();
      showToast('已刪除該戰術 🗑️');
    }

    function renderSavedTactics() {
      const list = document.getElementById('savedTacticsList');
      list.innerHTML = '';

      if (savedTactics.length === 0) {
        list.innerHTML = `<div class="text-center py-6 text-xs font-bold text-slate-400 bg-white border-2 border-dashed border-ink rounded-2xl">目前沒有儲存的戰術，拖曳球員後在上方儲存吧！</div>`;
        return;
      }

      savedTactics.forEach(item => {
        const card = document.createElement('div');
        card.onclick = () => loadSavedTactic(item.id);
        card.className = 'p-3 bg-white border-2 border-ink rounded-xl shadow-pop-sm flex items-center justify-between gap-2 cursor-pointer hover:bg-vYellow/20 transition-colors';
        card.innerHTML = `
          <div class="flex-1 min-w-0">
            <div class="text-xs font-black truncate">📌 ${item.title}</div>
            <div class="text-[11px] font-medium text-slate-500 truncate mt-0.5">${item.note}</div>
          </div>
          <div class="flex items-center gap-1.5">
            <span class="text-[10px] font-black px-2 py-1 rounded-lg bg-vBlue/30 border border-ink">載入</span>
            <button onclick="deleteSavedTactic('${item.id}', event)" class="text-slate-400 hover:text-rose-500 font-black px-1.5 py-1 text-xs">✕</button>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function exportBoardImage() {
      showToast('正在產生戰術圖卡...⏳');
      const target = document.getElementById('tacticBoardCapture');
      html2canvas(target, { scale: 2, backgroundColor: '#FDFBF7' }).then(canvas => {
        const link = document.createElement('a');
        link.download = `VolleyPlan_戰術板.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        showToast('戰術圖卡已下載！🖼️');
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => toast.classList.add('opacity-0', 'pointer-events-none'), 2200);
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadTactics();
      renderPieces();
      renderSavedTactics();
    });
  </script>
</body>
</html>
